<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="B waveform T">
<defs>
 <linearGradient id="letterTint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f0ff"/><stop offset=".48" stop-color="#8fe8e0"/><stop offset="1" stop-color="#ffc46c"/></linearGradient>
 <linearGradient id="waveTint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff795f"/><stop offset=".52" stop-color="#ffb36b"/><stop offset="1" stop-color="#ff795f"/></linearGradient>
 <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
 .letter{font-family:Arial,sans-serif;font-size:112px;font-weight:800;fill:url(#letterTint);letter-spacing:-5px}
 .brand-wave{fill:url(#waveTint);transform-box:fill-box;transform-origin:center;filter:url(#softGlow);animation:wavePulse 2.1s ease-in-out infinite alternate,waveShimmer 4.8s ease-in-out infinite}
 .letter-b{animation:letterB 1.1s cubic-bezier(.2,.8,.2,1) both}
 .letter-t{animation:letterT 1.1s .18s cubic-bezier(.2,.8,.2,1) both}
 @keyframes wavePulse{0%{transform:scaleY(.82) scaleX(.985)}100%{transform:scaleY(1.08) scaleX(1.015)}}
 @keyframes waveShimmer{0%,100%{opacity:.82}50%{opacity:1}}
 @keyframes letterB{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
 @keyframes letterT{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:translateX(0)}}
 @media(prefers-reduced-motion:reduce){.brand-wave,.letter-b,.letter-t{animation:none}}
</style>
<text class="letter letter-b" x="16" y="190">B</text>
<path class="brand-wave" d="M105 150 C135 150 150 147 160 135 C173 120 173 83 188 83 C205 83 207 125 224 128 C244 131 246 106 253 73 C260 40 268 14 278 14 C291 14 293 67 301 91 C308 111 320 112 327 93 C335 70 336 20 349 20 C363 20 365 78 372 112 C378 139 393 141 405 126 C418 109 420 82 436 82 C453 82 455 126 468 139 C480 150 493 150 515 150 C493 150 480 150 468 161 C455 174 453 218 436 218 C420 218 418 191 405 174 C393 159 378 161 372 188 C365 222 363 280 349 280 C336 280 335 230 327 207 C320 188 308 189 301 209 C293 233 291 286 278 286 C268 286 260 260 253 227 C246 194 244 169 224 172 C207 175 205 217 188 217 C173 217 173 180 160 165 C150 153 135 150 105 150Z"/>
<text class="letter letter-t" x="530" y="190">T</text>
</svg>
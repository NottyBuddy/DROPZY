<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090708"><title>DROPZY</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;overflow:hidden;background:#090708;color:#f7f0eb;font-family:Arial,sans-serif}
body:before{content:"";position:absolute;inset:-30%;background:radial-gradient(ellipse at 50% 48%,#c1122f38,transparent 36%),radial-gradient(ellipse at 50% 100%,#7b102425,transparent 45%);animation:glow 3.8s ease-in-out infinite alternate}
.splash{position:relative;width:min(92vw,900px);text-align:center;animation:arrive 1.1s cubic-bezier(.2,.8,.2,1) both}
.logo{width:100%;height:auto;filter:drop-shadow(0 0 24px #c1122f55);animation:pulse 2.6s ease-in-out infinite}
.ring{position:absolute;left:50%;top:44%;width:min(65vw,580px);aspect-ratio:1;transform:translate(-50%,-50%);border:1px solid #c1122f55;border-radius:50%;animation:orbit 5s linear infinite;pointer-events:none}
.ring:before,.ring:after{content:"";position:absolute;inset:9%;border:1px solid #f7f0eb25;border-radius:50%}.ring:after{inset:19%;border-color:#c1122f42}
.tag{margin-top:-3%;font-size:clamp(10px,2vw,14px);letter-spacing:.42em;color:#d7c7c2;opacity:0;animation:fade .7s 1s forwards}
.progress{height:2px;width:min(230px,48vw);margin:25px auto 0;background:#ffffff20;overflow:hidden;border-radius:3px}.progress i{display:block;height:100%;width:0;background:#c1122f;animation:load 5.5s linear forwards}
.skip{position:fixed;bottom:26px;right:26px;color:#c8b8b3;background:#171113;border:1px solid #53303a;padding:10px 16px;border-radius:99px;font-size:12px;text-decoration:none}
@keyframes arrive{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}@keyframes pulse{0%,100%{filter:drop-shadow(0 0 15px #c1122f30)}50%{filter:drop-shadow(0 0 36px #c1122f90)}}@keyframes orbit{to{rotate:360deg}}@keyframes glow{to{transform:scale(1.14);opacity:.7}}@keyframes fade{to{opacity:1}}@keyframes load{to{width:100%}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}.progress i{animation-duration:1ms!important}}
</style></head><body><main class="splash" aria-label="DROPZY loading"><div class="ring"></div><img class="logo" src="assets/dropzy-logo.svg" alt="DROPZY — Music Forever"><div class="tag">MUSIC · FOREVER</div><div class="progress"><i></i></div></main><a class="skip" href="listen.html">Skip intro ↗</a>
<script>window.setTimeout(()=>{window.location.replace("listen.html")},5500)</script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090708"><title>DROPZY — Music Forever</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;overflow:hidden;background:#050405;color:#f7f0eb;font-family:Arial,sans-serif}
.backdrop{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 44%,#b90e2c36 0,transparent 31%),radial-gradient(ellipse at 50% 100%,#65081930 0,transparent 50%),#050405;animation:breath 3.8s ease-in-out infinite alternate}
.grid{position:absolute;inset:0;opacity:.14;background-image:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px);background-size:46px 46px;mask-image:radial-gradient(ellipse at center,#000,transparent 74%)}
.stage{position:relative;width:min(92vw,760px);height:min(90vh,760px);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:enter 1s cubic-bezier(.2,.8,.2,1) both}
.orbit{position:absolute;width:min(75vw,570px);aspect-ratio:1;border:1px solid #e21b3a55;border-radius:50%;box-shadow:0 0 55px #c1122f22,inset 0 0 55px #c1122f13;animation:rotate 12s linear infinite}
.orbit:before,.orbit:after{content:"";position:absolute;inset:8%;border:1px solid #f7f0eb25;border-radius:50%}.orbit:after{inset:18%;border-color:#c1122f44}
.orbit i{position:absolute;left:13%;top:19%;width:10px;height:10px;border-radius:50%;background:#f7f0eb;box-shadow:0 0 18px #fff}
.logo-wrap{z-index:1;width:min(63vw,390px);aspect-ratio:1;display:grid;place-items:center;position:relative;animation:float 3.4s ease-in-out infinite}
.logo-wrap:before{content:"";position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle,#c1122f26,transparent 68%);filter:blur(14px);animation:halo 2s ease-in-out infinite alternate}
.logo{position:relative;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 18px #c1122f65);animation:logoGlow 2.5s ease-in-out infinite}
.wave{position:absolute;top:48%;width:min(96vw,1100px);height:150px;display:flex;align-items:center;justify-content:center;gap:5px;z-index:0;opacity:.72;mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent)}
.wave i{width:4px;height:var(--h);border-radius:8px;background:linear-gradient(180deg,#f7f0eb,#c1122f);box-shadow:0 0 12px #c1122f70;animation:equal .72s ease-in-out infinite alternate;animation-delay:var(--d)}
.word{margin-top:-16px;z-index:2;font-size:clamp(11px,2vw,15px);font-weight:700;letter-spacing:.55em;padding-left:.55em;color:#f7f0eb;text-shadow:0 0 18px #c1122f55;animation:rise .9s .55s both}
.word b{color:#e21b3a}
.progress{z-index:2;width:min(240px,48vw);height:4px;margin-top:27px;border-radius:9px;background:#ffffff24;overflow:hidden;box-shadow:0 0 15px #c1122f22}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8c0b24,#ed1b35,#fff0e9);box-shadow:0 0 14px #ed1b35;animation:load 5.5s linear forwards}
.loading{z-index:2;margin-top:12px;color:#bdaead;font-size:9px;letter-spacing:.48em;padding-left:.48em;animation:blink 1s steps(2) infinite}
.skip{position:fixed;bottom:24px;right:24px;z-index:4;color:#f7f0eb;background:#171113dd;border:1px solid #8b273a;padding:11px 17px;border-radius:99px;font-size:12px;text-decoration:none;backdrop-filter:blur(12px)}
.skip:active{transform:scale(.96)}
@keyframes enter{from{opacity:0;transform:scale(.86) translateY(18px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}@keyframes rotate{to{transform:rotate(360deg)}}@keyframes breath{to{filter:brightness(1.3)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}@keyframes halo{to{opacity:.45;transform:scale(1.2)}}@keyframes logoGlow{0%,100%{filter:drop-shadow(0 0 13px #c1122f55)}50%{filter:drop-shadow(0 0 30px #e21b3a99)}}@keyframes equal{from{transform:scaleY(.22);opacity:.5}to{transform:scaleY(1);opacity:1}}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes load{to{width:100%}}@keyframes blink{50%{opacity:.4}}
@media(max-height:650px){.stage{height:95vh}.logo-wrap{width:min(48vh,280px)}.orbit{width:min(62vh,380px)}.wave{height:100px}.progress{margin-top:14px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}.progress i{animation-duration:1ms!important}}

/* DROPZY intro interaction polish */
a,button,.logo-wrap,.orbit{transition:transform .45s cubic-bezier(.2,.75,.25,1),filter .4s ease,box-shadow .4s ease}
button:hover,a:hover{transform:translateY(-3px) scale(1.035);filter:brightness(1.12);text-shadow:0 0 16px rgba(193,18,47,.3)}
.logo-wrap:hover{transform:translateY(-5px) rotateY(-5deg) rotateX(3deg) scale(1.025)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

@media(hover:hover) and (pointer:fine){

  transform:translateY(-7px) rotateX(2deg) rotateY(-1deg) scale(1.012);
  box-shadow:0 18px 38px #0009,0 0 0 1px #c1122f45;
  border-color:#c1122f88;
 }
 :where(.tile,.card,.song-card,.playlist-card,.album-card,.artist-card,.radio-card,.feature-card,.source-card,.result-card,.cover-card,[class*="card"]):hover img{
  transform:scale(1.045);filter:saturate(1.12) brightness(1.04)

 :where(button,.btn,.chip,nav a,.mobile-dock a,.back):hover{

 .track:hover{transform:translateY(-3px) translateX(3px);box-shadow:0 10px 25px #0007,0 0 0 1px #c1122f55}
}
:where(button,a,input,textarea,select):focus-visible{outline:2px solid #c1122f;outline-offset:3px}
@media(hover:none),(pointer:coarse){
 :where(.tile,.track,.card,.song-card,.playlist-card,.album-card,.artist-card,.radio-card,.feature-card,.source-card,.result-card,.cover-card,.stat-card,[class*="card"],article,button,.btn,.chip,a,nav a,.mobile-dock a,.back){transform:none!important;filter:none}
}
@media(prefers-reduced-motion:reduce){
 html{scroll-behavior:auto}
 *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08080d"><title>DROPZY — Admin Review</title>
<style>
:root{color-scheme:dark;--bg:#09080f;--panel:#171520;--line:#393044;--pink:#ff3d9a;--muted:#aaa5b8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f8f6fc;font:14px system-ui,sans-serif}main{max-width:1000px;width:92%;margin:40px auto 100px}.brand{font-size:27px;font-weight:900}.brand span{color:var(--pink)}h1{font-size:36px;letter-spacing:-1.5px}.panel,.item{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:20px;margin:14px 0}.item h3{margin:0 0 6px}.muted{color:var(--muted);line-height:1.6}input,textarea{width:100%;background:#0d0c13;border:1px solid var(--line);border-radius:10px;padding:12px;color:white;margin:6px 0 12px}button{border:0;border-radius:22px;padding:11px 17px;font-weight:800;color:white;background:linear-gradient(100deg,var(--pink),#875cff);cursor:pointer;margin:6px 6px 0 0}button.secondary{background:#ffffff14;border:1px solid #ffffff25}.danger{background:#7d284b}.hidden{display:none!important}.status{color:#ff91c5;min-height:22px}.meta{font-size:12px;color:#bdb7ca;white-space:pre-wrap;overflow-wrap:anywhere}
</style></head><body><main><a href="./" style="color:inherit;text-decoration:none"><div class="brand">DROP<span>ZY</span></div></a>
<h1>Submission review</h1><p class="muted">Private admin area. Only an authenticated Supabase user with app_metadata role = admin can review tracks.</p>
<section class="panel" id="login-panel"><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button id="login">Sign in</button><div id="status" class="status" aria-live="polite"></div></section>
<section id="review-panel" class="hidden"><div class="panel"><span id="admin-label" class="muted"></span><button class="secondary" id="refresh">Refresh pending</button><button class="secondary" id="logout">Sign out</button><div id="status2" class="status" aria-live="polite"></div></div><div id="pending"></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='YOUR_SUPABASE_PROJECT_URL';
const SUPABASE_ANON_KEY='YOUR_SUPABASE_ANON_KEY';
const configured=SUPABASE_URL.startsWith('https://')&&!SUPABASE_URL.includes('YOUR_')&&!SUPABASE_ANON_KEY.includes('YOUR_');
const $=id=>document.getElementById(id);let client=null,session=null;
function status(t){$('status').textContent=t;$('status2').textContent=t}
if(configured&&window.supabase)client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
else status('Configure the same Supabase URL and public anon key as the artist portal before use.');
$('login').onclick=async()=>{if(!client)return;const {data,error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return status(error.message);session=data.session;await enter();};
async function enter(){if(!session)return;const user=session.user;if(user.app_metadata?.role!=='admin'){status('Access denied: this account is not assigned the DROPZY admin role.');await client.auth.signOut();return;} $('login-panel').classList.add('hidden');$('review-panel').classList.remove('hidden');$('admin-label').textContent='Signed in: '+user.email;await refresh();}
async function refresh(){if(!client||!session)return;status('Loading pending submissions…');const {data,error}=await client.from('song_submissions').select('id,title,artist,language,genre,version_label,original_filename,rights_note,rights_proof_path,created_at').eq('status','pending').order('created_at',{ascending:true});if(error)return status(error.message);const root=$('pending');root.replaceChildren();if(!data.length){root.textContent='No pending submissions.';status('');return;}for(const row of data){const card=document.createElement('article');card.className='item';const h=document.createElement('h3');h.textContent=row.title+' — '+row.artist;const meta=document.createElement('div');meta.className='meta';meta.textContent=[row.language,row.genre||'',row.version_label||'original','File: '+row.original_filename,'Rights note: '+row.rights_note,'Rights evidence: '+(row.rights_proof_path?'attached (private)':'not attached'),'Submitted: '+new Date(row.created_at).toLocaleString()].filter(Boolean).join('\n');const note=document.createElement('textarea');note.placeholder='Reviewer note (optional)';note.rows=2;const approve=document.createElement('button');approve.textContent='Approve';approve.onclick=()=>review(row.id,'approved',note.value,approve);const reject=document.createElement('button');reject.textContent='Reject';reject.className='danger';reject.onclick=()=>review(row.id,'rejected',note.value,reject);card.append(h,meta,note,approve,reject);root.append(card);}status(data.length+' pending submission(s).');}
async function review(id,next,note,button){button.disabled=true;status('Saving review…');try{const {data}=await client.auth.getSession();const token=data.session?.access_token;if(!token)throw new Error('Please sign in again.');const response=await fetch(SUPABASE_URL+'/functions/v1/dropzy-catalog',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+token},body:JSON.stringify({id,status:next,reviewer_note:note})});const result=await response.json();if(!response.ok)throw new Error(result.error||'Review failed.');status('Submission '+next+'.');await refresh();}catch(e){status(e.message||'Review failed.');button.disabled=false;}}
$('refresh').onclick=refresh;$('logout').onclick=async()=>{await client?.auth.signOut();session=null;$('review-panel').classList.add('hidden');$('login-panel').classList.remove('hidden');status('Signed out.');};
</script></body></html>
